name: Job pull (3 times a day)

on:
  schedule:
    # Three editions a day, by Montreal time: morning (before 11:00), midday (11:00-16:59), evening (17:00 on).
    # GitHub starts scheduled jobs late, sometimes hours late, so there's an attempt every two hours. Each run works
    # out its edition and builds only if that edition isn't published yet; the rest stop after a few seconds.
    - cron: "17 */2 * * *"
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh
  push:                     # rebuild right away when the engine or board list changes
    branches: [main]
    paths: ["fetch.py", "sources.py", "net.py", "reqs.py", "template.html", "data/boards.json", "data/cvca.json", "firms_seed.py", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Canada-wide: a few hundred boards plus a 25-minute LinkedIn sweep
    env:
      TZ: America/Toronto     # dates, "today" and the edition are Montreal's, not the server's
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # the latest book, not the commit that was current when this run was queued
      - name: Edition already built?
        id: check
        run: |
          h=$((10#$(date +%H)))
          if [ $h -lt 11 ]; then ed=morning; elif [ $h -lt 17 ]; then ed=midday; else ed=evening; fi
          slot="$(date +%F)-$ed"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"slot\": \"$slot\"" docs/index.html; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "The $ed book for $(date +%F) (Montreal) is already published; skipping."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.check.outputs.done != 'true'
      - run: python fetch.py
        if: steps.check.outputs.done != 'true'
        env:
          PB_SLOT: ${{ steps.check.outputs.slot }}
      - name: Save the book
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name  "position-book-bot"
          git config user.email "position-book-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Book for ${{ steps.check.outputs.slot }}"
          git pull --rebase --autostash origin main
          git push
