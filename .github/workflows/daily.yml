name: Daily job pull

on:
  schedule:
    - cron: "0 10 * * *"   # 6:00 am Montreal (summer time), 5:00 am in winter
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh
  push:                     # rebuild right away when the engine or board list changes
    branches: [main]
    paths: ["fetch.py", "sources.py", "template.html", "data/boards.json", "firms_seed.py"]

permissions:
  contents: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - name: Save today's book
        run: |
          git config user.name  "position-book-bot"
          git config user.email "position-book-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Book for $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
